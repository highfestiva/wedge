services:
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081" # Map Mongo Express port to your host
    environment:
      ME_CONFIG_MONGODB_SERVER: wedge-mongo
      ME_CONFIG_MONGODB_PORT: 27017
    networks:
      - wedge_network

networks:
  wedge_network:
    external: true
