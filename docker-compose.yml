services:
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: wedge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - wedge_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedge-backend
    environment:
      # These environment variables are provided for future use in the
      # backend; the current code defaults to localhost but can be wired
      # to read these.
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=wedge
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    networks:
      - wedge_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile #-prod  # <-- use suffix for production build
    container_name: wedge-frontend
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - wedge_network

volumes:
  mongo_data:

networks:
  wedge_network:
    external: true
