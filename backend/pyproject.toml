[project]
name = "wedge-backend"
version = "0.1.0"
description = "Wedge Issue Tracker — Backend"
requires-python = ">=3.12"
dependencies = [
    "strawberry-graphql[asgi]>=0.220.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
    "motor>=3.3.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "mongomock-motor>=0.0.30",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
